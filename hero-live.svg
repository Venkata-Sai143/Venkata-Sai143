<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject width="900" height="230">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * { box-sizing: border-box; margin:0; padding:0; }
        .wrap{
          width:884px; height:214px; margin:8px;
          background:#100b14;
          border-radius:14px;
          position:relative;
          font-family: 'Trebuchet MS','Segoe UI',sans-serif;
          overflow:hidden;
          box-shadow:0 0 18px 0 rgba(120,10,50,0.3);
        }
        /* Breathing gradient border ring — matches the live page's animated outline */
        .border-glow{
          position:absolute; inset:0; border-radius:14px;
          pointer-events:none; z-index:3;
          border:1.5px solid transparent;
          background:
            linear-gradient(135deg,
              rgba(255,77,149,0.75) 0%,
              rgba(160,20,70,0.35) 28%,
              rgba(80,5,25,0.12) 50%,
              rgba(160,20,70,0.35) 72%,
              rgba(255,77,149,0.75) 100%
            ) border-box;
          -webkit-mask:
            linear-gradient(#000 0 0) padding-box,
            linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          animation: glow-breathe 3s ease-in-out infinite;
        }
        @keyframes glow-breathe{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

        .inner{
          position:relative; z-index:1;
          display:flex; align-items:center; gap:22px;
          height:100%; padding:0 32px;
        }
        .avatar{
          width:64px; height:64px; border-radius:50%;
          background:linear-gradient(135deg,#c53080,#6c1a8f);
          border:2px solid #ff2b7a;
          display:flex; align-items:center; justify-content:center;
          font-size:24px; font-weight:700; color:#fff; flex-shrink:0;
          box-shadow:0 0 14px rgba(224,53,122,0.45);
        }
        .name{ font-size:27px; font-weight:700; color:#f0eff5; margin-bottom:3px; }
        .role{ font-size:15px; color:#ff4d95; font-weight:500; margin-bottom:10px; }
        .typing{
          font-family:'Courier New',monospace; font-size:14px; color:#ff4d95;
          white-space:nowrap; overflow:hidden; border-right:2px solid #ff4d95;
          width:0; display:inline-block;
          animation: typing 5s steps(48,end) infinite alternate,
                     caret .75s step-end infinite;
        }
        @keyframes typing{ from{width:0;} to{width:420px;} }
        @keyframes caret{ 50%{ border-color:transparent; } }

        .cd{
          position:absolute; width:9px; height:9px;
          background:#ff4d95; transform:rotate(45deg);
          box-shadow:0 0 6px 2px rgba(255,77,149,0.7), 0 0 14px 3px rgba(255,77,149,0.35);
          animation: pulse 2.5s ease-in-out infinite;
          z-index:4;
        }
        .tl{ top:-5px; left:-5px; animation-delay:0s; }
        .tr{ top:-5px; right:-5px; animation-delay:-0.8s; }
        .br{ bottom:-5px; right:-5px; animation-delay:-1.6s; }
        .bl{ bottom:-5px; left:-5px; animation-delay:-2.2s; }
        @keyframes pulse{
          0%,100%{ opacity:.55; transform:rotate(45deg) scale(1); }
          50%{ opacity:1; transform:rotate(45deg) scale(1.35); }
        }
      </style>
      <div class="wrap">
        <div class="border-glow"></div>
        <span class="cd tl"></span><span class="cd tr"></span>
        <span class="cd br"></span><span class="cd bl"></span>
        <div class="inner">
          <div class="avatar">VS</div>
          <div>
            <div class="name">Hi, I'm Venkata Sai 👋</div>
            <div class="role">Aspiring Data Analyst · Hyderabad, Telangana</div>
            <div class="typing">Excel · SQL · Power BI · Python</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
